# Música del pódcast (biblioteca libre). Se lanza a mano. La pista elegida se guarda solo en la
# carpeta privada del pódcast en Dropbox (/musica), nunca en este repositorio público.
#   modo listar   → títulos y enlaces de pistas (en «enlaces», páginas de Mixkit; vacío = las de siempre)
#   modo analizar → duración, tempo y estabilidad de las pistas de «enlaces»
#   modo describir → Gemini «escucha» las pistas de «enlaces» y dice si sirven de fondo de informativo
#   modo fondo    → guarda la pista de «enlaces» como cama musical (/musica/fondo.mp3)
name: Preparar música

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "listar, analizar, describir o fondo"
        required: false
        default: "listar"
        type: string
      enlaces:
        description: "Enlaces separados por espacios"
        required: false
        type: string

permissions:
  contents: read

jobs:
  musica:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODO: ${{ inputs.modo }}
      ENLACES: ${{ inputs.enlaces }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install numpy
          command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: python -m podcast.musica_libre "${MODO:-listar}" $ENLACES

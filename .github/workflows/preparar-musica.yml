# Prepara la sintonía de entrada y cierre a partir de una pista de biblioteca libre
# y la deja en la carpeta privada del pódcast en Dropbox (/musica). Se lanza a mano.
# Sin enlace: solo lista pistas disponibles.
name: Preparar música

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Enlace .mp3 de la pista (vacío = solo listar)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  musica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      URL_PISTA: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v5
      - run: command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: |
          if [ -n "$URL_PISTA" ]; then python3 -m podcast.musica_libre preparar "$URL_PISTA"; else python3 -m podcast.musica_libre listar; fi

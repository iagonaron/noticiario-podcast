# Diagnóstico técnico a mano (no se ejecuta solo). Los resultados son anotaciones sin datos personales.
name: Diagnóstico

on:
  workflow_dispatch:
    inputs:
      pruebas:
        description: "Pruebas separadas por espacios: elpais noticias voz guion"
        required: false
        default: "voz"
        type: string

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRUEBAS: ${{ inputs.pruebas }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: python -m podcast.diagnostico $PRUEBAS

# Diagnóstico técnico a mano (no se ejecuta solo). Los resultados son anotaciones sin datos personales.
name: Diagnóstico

on:
  workflow_dispatch:
    inputs:
      pruebas:
        description: "Pruebas separadas por espacios: elpais noticias voz edge piper vozlarga guion planes cortes muestras pronuncia fricativas pausas recortar timbre historia"
        required: false
        default: "voz"
        type: string
      modelos_voz:
        description: "Modelos de voz a probar (vacío = los de siempre)"
        required: false
        type: string
      sin_etiqueta:
        description: "Para «cortes»: pedir el lote sin la etiqueta de pausa entre turnos (si/no)"
        required: false
        default: "no"
        type: string
      cortes_viejos:
        description: "Para «recortar»: cortar con la regla de antes del 15-oct, para comparar (si/no)"
        required: false
        default: "no"
        type: string
      crudo:
        description: "Para «recortar»: carpeta de Dropbox con los lotes guardados (vacío = /Pruebas/Crudo de la prueba)"
        required: false
        type: string
      fecha:
        description: "Para «historia»: día a recuperar, AAAA-MM-DD (vacío = ayer)"
        required: false
        type: string
      modelos_texto:
        description: "Para «planes_tiempos»: probar solo estos modelos de texto (separados por comas)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      CALENDARIOS_ICS: ${{ secrets.CALENDARIOS_ICS }}
      PRUEBAS: ${{ inputs.pruebas }}
      MODELOS_VOZ: ${{ inputs.modelos_voz }}
      MODELOS_TEXTO_PRUEBA: ${{ inputs.modelos_texto }}
      CRUDO: ${{ inputs.crudo }}
      FECHA: ${{ inputs.fecha }}
      SIN_ETIQUETA: ${{ inputs.sin_etiqueta }}
      CORTES_VIEJOS: ${{ inputs.cortes_viejos == 'si' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: python -m podcast.diagnostico $PRUEBAS

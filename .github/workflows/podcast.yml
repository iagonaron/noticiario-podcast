# El robot del Noticiario Podcast.
# Quién lo arranca cada mañana:
# 1) El despertador: una tarea programada de Claude (en la nube) que a las 7:16 de Madrid lo
#    lanza con «Run workflow» y forzar=no. Existe porque el reloj de GitHub no es de fiar: el
#    13 y el 14-oct-2026 no arrancó a su hora la cita de las 7:20 ni las siguientes.
# 2) De respaldo, las citas propias de GitHub, cada 10 minutos (hora universal, UTC).
# Sea quien sea, el propio robot decide (podcast/toca.py): genera la primera vez que salta a
# partir de las 7:15 de Madrid, en verano y en invierno, y las demás ven que el de hoy ya está
# en Dropbox y no hacen nada (tardan unos segundos).
#
# Para pausarlo: pestaña Actions → «Noticiario Podcast» → «···» → Disable workflow (y pausar
# también el despertador en las tareas programadas de Claude).
# Para probarlo cuando quieras: Actions → «Noticiario Podcast» → Run workflow.

name: Noticiario Podcast

on:
  schedule:
    - cron: "17,27,37,47,57 5-7 * * *"   # verano (UTC+2): de 7:17 a 9:57 · invierno (UTC+1): de 6:17 a 8:57 (antes de las 7:15 no hace nada)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Generar aunque el de hoy ya esté en Dropbox (si/no). El despertador de Claude usa «no»"
        required: false
        default: "si"
        type: string
      modelos_voz:
        description: "Solo para pruebas: modelos de voz a usar (vacío = los de siempre)"
        required: false
        type: string
      motor_voz:
        description: "Solo para pruebas: gemini, edge o piper (vacío = el de siempre)"
        required: false
        type: string
      prueba:
        description: "Prueba: deja el resultado en Dropbox/…/Pruebas sin pisar el episodio del día (si/no)"
        required: false
        default: "no"
        type: string

permissions:
  contents: write          # solo para el «latido» mensual que mantiene viva la programación

concurrency:
  group: noticiario-podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      FORZAR: ${{ github.event_name == 'workflow_dispatch' && (inputs.forzar || 'si') || 'no' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      CALENDARIOS_ICS: ${{ secrets.CALENDARIOS_ICS }}
      VOZ_A: ${{ vars.VOZ_A }}
      VOZ_B: ${{ vars.VOZ_B }}
      MOTOR_VOZ: ${{ inputs.motor_voz || vars.MOTOR_VOZ }}
      PRUEBA: ${{ inputs.prueba || 'no' }}
      MODELOS_VOZ: ${{ inputs.modelos_voz || vars.MODELOS_VOZ }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Toca generar ahora?
        id: toca
        run: python3 -m podcast.toca

      - uses: actions/setup-python@v6
        if: steps.toca.outputs.toca == 'si'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar lo necesario
        if: steps.toca.outputs.toca == 'si'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)

      - name: Generar el pódcast y subirlo a Dropbox
        if: steps.toca.outputs.toca == 'si'
        run: python -m podcast.main

      - name: Latido mensual (GitHub apaga las tareas programadas de repos sin actividad en 60 días)
        if: always()
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40 * 86400 )) ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > latido.txt
            git config user.name "noticiario-podcast"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latido.txt
            git commit -m "Latido mensual: mantiene activa la programación"
            git push
          fi

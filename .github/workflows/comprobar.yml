# Comprobación a mano del último episodio: lo transcribe y lo compara con el guion.
# El informe queda en la carpeta privada del pódcast en Dropbox («Comprobación.txt»).
name: Comprobar episodio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install faster-whisper
          command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: python -m podcast.comprobar
